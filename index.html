&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

&lt;div id=&quot;ge-aims-map&quot;&gt;
  &lt;h2&gt;What We Promise, What We Cultivate&lt;/h2&gt;
  &lt;p class=&quot;text-small&quot;&gt;Mapping DePauw’s Educational Aims across Career Readiness, General Education, and First-Year Learning and Advising&lt;/p&gt;
  &lt;div class=&quot;viz-row text-small ge-legend&quot;&gt;&lt;span class=&quot;ge-key ge-solid&quot;&gt;&lt;/span&gt;Clear textual correspondence &lt;span class=&quot;ge-key ge-dashed&quot;&gt;&lt;/span&gt;Partial or interpretive correspondence&lt;/div&gt;

    &lt;svg class=&quot;ge-edges&quot; aria-hidden=&quot;true&quot;&gt;&lt;/svg&gt;
    &lt;section class=&quot;ge-left&quot;&gt;&lt;h3&gt;NACE · 8 competencies&lt;/h3&gt;&lt;div class=&quot;ge-nace&quot;&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section class=&quot;ge-middle&quot;&gt;&lt;h3&gt;DePauw · 12 aims&lt;/h3&gt;&lt;div class=&quot;ge-aims&quot;&gt;&lt;/div&gt;&lt;/section&gt;
    &lt;section class=&quot;ge-right&quot;&gt;&lt;h3&gt;Gen Ed + FYS/Advising&lt;/h3&gt;&lt;div class=&quot;ge-outcomes&quot;&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ge-detail&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;details class=&quot;ge-process&quot;&gt;&lt;summary&gt;About this map · AI assistance and interpretive process&lt;/summary&gt;
    &lt;p class=&quot;text-small&quot;&gt;Prepared by Justin Glessner with assistance from OpenAI’s Codex, October 19, 2026. This exploratory map grew from a collaborative reading of the source documents and discussion of possible relationships among them. Codex assisted with comparison, proposed connections and explanations, and built the interactive visualization. Justin shaped the questions, reviewed the working analysis, and requested revisions. The visual translation includes additional interpretive judgments that remain open to review and correction.&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;DePauw’s twelve educational aims organize the map. Connections point outward to NACE competencies and to Gen Ed outcomes, FYS expectations, and advising materials. Solid lines indicate clear textual correspondence; dashed lines indicate partial or interpretive correspondence. These categories are qualitative judgments, not calculated confidence scores. An omitted connection is an invitation to examine the texts further, not proof that the relationship or learning is absent.&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;The map asks where institutional commitments are articulated in these documents and where further curricular attention may be useful. It does not assess courses, instructors, programs, or student attainment. Source statements differ in purpose and status, including faculty-approved aims, draft outcomes, program guidelines, and advising aspirations. This is a working interpretation for discussion, not an adopted CPPC position.&lt;/p&gt;
  &lt;/details&gt;
  &lt;details class=&quot;ge-register&quot;&gt;&lt;summary&gt;All outcomes and expectations&lt;/summary&gt;&lt;div class=&quot;ge-all&quot;&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details class=&quot;ge-sources&quot;&gt;&lt;summary&gt;Sources and reading the connections&lt;/summary&gt;
    &lt;p class=&quot;text-small&quot;&gt;Working interpretation, October 19, 2026. Links describe correspondence between texts, not causal delivery, achieved learning, statistical confidence, or equal scope. A clear link may support only one clause of an aim. Labels and outcome descriptions are condensed for reading. Unlinked items remain visible in the full inventory; their absence from a selected view means no defensible direct link was recorded here. FYS + Advising is one visual group; selecting an endpoint identifies whether its source is the Catalog, FYS writing guidelines, writing assessment expectations, or advising mission/guide.&lt;/p&gt;
    &lt;ul class=&quot;text-small&quot;&gt;
      &lt;li&gt;The Purpose and Aims of DePauw (faculty-approved institutional statement, supplied PDF). Aim labels are shortened; selecting an aim shows its exact wording.&lt;/li&gt;
      &lt;li&gt;NACE, Competencies for a Career-Ready Workforce (2025 supplied PDF), including Equity + Inclusion. This map uses that supplied version.&lt;/li&gt;
      &lt;li&gt;Draft General Education Curriculum Learning Outcomes (supplied Assessment/Amity working document). Arts and Humanities are separate alternatives; the combined AH version is excluded. A link to draft language does not establish a current universal requirement.&lt;/li&gt;
      &lt;li&gt;University Catalog 2025–26, p. 15: five shared First-Year Seminar expectations.&lt;/li&gt;
      &lt;li&gt;Writing in First-Year Seminars (WCC, September 2017), circulated as the latest guidelines by FYS Director Mike Seaman on August 14, 2025. Learning outcomes and assessment expectations are distinguished in the inventory.&lt;/li&gt;
      &lt;li&gt;&lt;a href=&quot;https://www.depauw.edu/academics/academic-resources/advising/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Advising mission&lt;/a&gt; and &lt;a href=&quot;https://www.depauw.edu/academics/academic-resources/advising/advising-guide/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Advising Guide&lt;/a&gt;, read October 19, 2026. These are mission statements and developmental prompts, not assessed course outcomes.&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/details&gt;

(() =&gt; {
const root=document.getElementById(&#x27;ge-aims-map&#x27;);
const A=[
[&#x27;Love learning&#x27;,&#x27;Love learning and exude a commitment to continued learning throughout their lives.&#x27;,&#x27;FYS writing explicitly names passion; advising names lifelong curiosity. Those are narrower or different kinds of commitment from demonstrated lifelong love of learning. Most Gen Ed links are diffuse possibilities, not explicit outcomes.&#x27;],
[&#x27;Methods + interdisciplinary synthesis&#x27;,&#x27;Appreciate varied disciplinary and interdisciplinary methods for acquiring knowledge and demonstrate the ability to synthesize knowledge from multiple disciplines.&#x27;,&#x27;Disciplinary methods are well represented. Transfer across fields and synthesis of sources are not the same as demonstrated synthesis across disciplines. That integrative requirement remains thin.&#x27;],
[&#x27;Achievements + their limits&#x27;,&#x27;Understand and value artistic, cultural, and scientific achievements and the limits of those achievements, past and present.&#x27;,&#x27;Arts, humanities, and science provide clear encounters with achievements. Critique and inquiry offer partial routes to their limits; valuing those achievements is not uniformly stated.&#x27;],
[&#x27;Cultures, languages + power&#x27;,&#x27;Understand and appreciate cultures, languages and groups different than their own and regularly reflect on domestic and global issues of power, privilege and diversity.&#x27;,&#x27;Multiple explicit connections reach different clauses: cultural difference, languages, and domestic/global power. Many links do not individually cover the whole aim.&#x27;],
[&#x27;Problems · together + individually&#x27;,&#x27;Identify and solve well-defined and ill-defined problems both collaboratively and individually, and apply these skills to problems facing humanity.&#x27;,&#x27;Problem-solving is explicit in several areas. The texts are less consistent about ill-defined problems, individual and collaborative modes together, and application to problems facing humanity.&#x27;],
[&#x27;Quantitative + qualitative analysis&#x27;,&#x27;Demonstrate competency with varied forms of data analysis including organizing, interpreting, and drawing conclusions from quantitative and qualitative information.&#x27;,&#x27;Quantitative analysis is explicit, and Social Sciences explicitly includes qualitative methods. Qualitative analysis is present in other disciplines too, but not every interpretive outcome explicitly names data organization or analysis.&#x27;],
[&#x27;Technology + society&#x27;,&#x27;Demonstrate knowledge of technology and its implications in society and be able to leverage technology, where appropriate, for creative activities or innovative solutions to problems.&#x27;,&#x27;NACE names technology directly. Arts tools and scientific applications cover pieces of the aim; none of these outcome statements clearly guarantees both technological practice and examination of its societal implications for every student.&#x27;],
[&#x27;Independent thought + evidence&#x27;,&#x27;Develop capacities for clear, thorough, and independent thought that demonstrates the ability to analyze arguments on the basis of evidence and to understand the value and limitations of multiple types of evidence.&#x27;,&#x27;Argument and evidence have many explicit homes. Independence and the limits of different evidence types are less consistently named. Revision or source use alone does not establish independent judgment.&#x27;],
[&#x27;Written + oral expression&#x27;,&#x27;Clearly express their ideas and the ideas of others to varied audiences, both in writing and orally.&#x27;,&#x27;Writing, oral communication, FYS source work, and audience awareness offer strong textual support. Separate links contribute different components of the aim.&#x27;],
[&#x27;Ethical reflection + acting for good&#x27;,&#x27;Engage in serious reflection on the moral and ethical aspects of situations and cultivate a commitment to act in the world for good.&#x27;,&#x27;Ethical analysis is explicit. Ethical communication and service settings offer partial routes to action; a commitment to act for good extends beyond analyzing an ethical question.&#x27;],
[&#x27;Healthy, sustainable + relational living&#x27;,&#x27;Embrace healthy and sustainable living through self-reflection and commitment to cultivating positive relationships with others, and both the global and local environment.&#x27;,&#x27;The advising guide explicitly raises healthy habits and self-care; FYS and advising provide relational settings. Sustainable living and relationships with the local/global environment remain weakly articulated in this set of outcomes.&#x27;],
[&#x27;Depth + future learning&#x27;,&#x27;Attain a deep understanding of a subject area to appreciate the value of depth of knowledge and to serve as a foundation for future learning.&#x27;,&#x27;The Catalog explicitly locates depth in the major and capstone. FYS, advising, and intensive work can prepare for depth; they do not replace the major or guarantee depth through Gen Ed.&#x27;]
];
const N=[[&#x27;nd&#x27;,&#x27;Career + Self-Development&#x27;,&#x27;Continual personal/professional learning, awareness of strengths, navigating opportunities, and building relationships.&#x27;],[&#x27;nc&#x27;,&#x27;Communication&#x27;,&#x27;Clear and effective exchange of information, ideas, facts, and perspectives.&#x27;],[&#x27;nt&#x27;,&#x27;Critical Thinking&#x27;,&#x27;Understanding context and analyzing information to respond to needs and solve problems.&#x27;],[&#x27;ne&#x27;,&#x27;Equity + Inclusion&#x27;,&#x27;Equitable engagement across cultures and backgrounds, including challenges to oppressive structures.&#x27;],[&#x27;nl&#x27;,&#x27;Leadership&#x27;,&#x27;Recognizing and using personal and team strengths toward organizational goals.&#x27;],[&#x27;np&#x27;,&#x27;Professionalism&#x27;,&#x27;Effective work habits, integrity, accountability, and the interests of the wider community and workplace.&#x27;],[&#x27;nw&#x27;,&#x27;Teamwork&#x27;,&#x27;Collaborative relationships, shared goals and responsibilities, and appreciation of diverse viewpoints.&#x27;],[&#x27;nx&#x27;,&#x27;Technology&#x27;,&#x27;Ethical use of technology to complete tasks and accomplish goals.&#x27;]];
const G={ar:&#x27;Arts&#x27;,hu:&#x27;Humanities&#x27;,sm:&#x27;Science &amp; Mathematics&#x27;,ss:&#x27;Social Sciences&#x27;,es:&#x27;Extended Studies&#x27;,gl:&#x27;Global Learning&#x27;,pp:&#x27;Power, Privilege &amp; Diversity&#x27;,wr:&#x27;Writing competency&#x27;,qr:&#x27;Quantitative reasoning&#x27;,oc:&#x27;Oral communication&#x27;,la:&#x27;Intercultural language&#x27;,fc:&#x27;FYS + Advising&#x27;,fw:&#x27;FYS + Advising&#x27;,fa:&#x27;FYS + Advising&#x27;,ad:&#x27;FYS + Advising&#x27;};
const provenance={fc:&#x27;Catalog 2025–26 · FYS expectations&#x27;,fw:&#x27;FYS writing guidelines · learning outcomes (2017; circulated 2025)&#x27;,fa:&#x27;FYS writing guidelines · assessment expectations (2017; circulated 2025)&#x27;,ad:&#x27;Advising mission / developmental guide&#x27;};
const groupTitles=[...new Set(Object.values(G))];
